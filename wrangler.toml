# ============================================================
# MỘT REPO — NHIỀU WORKER
# Mỗi Worker trên Cloudflare nối vào CHÍNH repo này, chỉ khác lệnh deploy:
#   Worker "danhgia" : Deploy command = npx wrangler deploy
#   Worker "ktthu"   : Deploy command = npx wrangler deploy --env ktthu
#   Worker "ttgdyh"  : Deploy command = npx wrangler deploy --env ttgdyh
# Thêm Worker mới: thêm 2 dòng [env.<tên>] / name = "<tên>" ở cuối file,
# rồi đặt Deploy command của Worker đó là: npx wrangler deploy --env <tên>
# Biến APPS_SCRIPT_URL / PROXY_KEY đặt riêng trên từng Worker (keep_vars giữ nguyên khi deploy).
# ============================================================
name = "danhgia"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Giữ nguyên các biến đã đặt trên dashboard mỗi lần deploy
keep_vars = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api"]

# Giữ Apps Script luôn "ấm": cứ 5 phút gọi nhẹ 1 lần, 7h00–18h59 giờ Việt Nam (0h–11h UTC)
[triggers]
crons = ["*/5 0-11 * * *"]

# ----- Các Worker dùng chung repo này (tên phải trùng tên Worker trên Cloudflare) -----
[env.ktthu]
name = "ktthu"

[env.ttgdyh]
name = "ttgdyh"
